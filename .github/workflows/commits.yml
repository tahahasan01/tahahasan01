name: Update Recent Commits

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Refresh commits table
        run: python .github/scripts/update_commits.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      # authored with the owner's no-reply email so the commit counts on the contribution graph
      - name: Commit if changed
        run: |
          git config user.name "Taha Hasan"
          git config user.email "129673119+tahahasan01@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Update recent commits" && git push)
